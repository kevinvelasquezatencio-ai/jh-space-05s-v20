
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Un abrazo para ti | My Love</title>

<style>

/* ==========================================
   MY LOVE - UN ABRAZO PARA TI
========================================== */

:root {
  --negro: #050912;
  --marino: #0d2038;
  --celeste: #91d9ed;
  --blanco: #f4faff;
  --gris: #a6b7c8;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  min-height: 100vh;
  overflow-x: hidden;

  color: var(--blanco);

  font-family:
    "Segoe UI",
    Arial,
    sans-serif;

  background:
    radial-gradient(
      ellipse at 50% 45%,
      rgba(44,106,159,.16),
      transparent 52%
    ),
    linear-gradient(
      160deg,
      #03060e,
      #0d213a 55%,
      #040814
    );
}

/* ==========================================
   FONDO
========================================== */

.fondo {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  overflow: hidden;
}

.luz {
  position: absolute;
  border-radius: 50%;
  filter: blur(85px);
  animation: respirar 7s ease-in-out infinite;
}

.luz.uno {
  width: 300px;
  height: 300px;
  top: -130px;
  left: -120px;
  background: rgba(49,140,201,.15);
}

.luz.dos {
  width: 320px;
  height: 320px;
  right: -140px;
  bottom: -140px;
  background: rgba(37,98,171,.15);
  animation-delay: 3s;
}

@keyframes respirar {
  0%,100% {
    opacity: .35;
    transform: scale(1);
  }

  50% {
    opacity: .8;
    transform: scale(1.18);
  }
}

/* ==========================================
   CONTENIDO
========================================== */

.pagina {
  min-height: 100vh;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 42px 20px;
}

.contenido {
  width: min(700px,100%);
  text-align: center;
}

.etiqueta {
  color: #80c7df;
  font-size: 10px;
  letter-spacing: 4px;
  margin-bottom: 17px;
}

h1 {
  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: clamp(30px,5vw,46px);
  font-weight: 400;
  line-height: 1.3;
}

h1 span {
  color: var(--celeste);
}

.subtitulo {
  max-width: 490px;
  margin: 18px auto 0;

  color: #b4c9d8;
  font-size: 14px;
  line-height: 1.9;
}

/* ==========================================
   IMAGEN ORIGINAL
========================================== */

.imagen-contenedor {
  position: relative;

  width: min(480px,100%);
  margin: 35px auto 0;

  padding: 8px;

  border-radius: 25px;

  border:
    1px solid rgba(145,215,237,.22);

  background:
    rgba(255,255,255,.025);

  box-shadow:
    0 26px 70px rgba(0,0,0,.38),
    0 0 60px rgba(80,165,218,.065);

  animation:
    aparecerImagen 1.1s ease both;
}

.imagen-contenedor img {
  display: block;

  width: 100%;
  height: auto;

  border-radius: 18px;
}

/* BRILLO DETRÁS DE LA IMAGEN */

.resplandor {
  position: absolute;
  z-index: -1;

  inset: -20px;

  border-radius: 40%;

  background:
    rgba(63,157,209,.12);

  filter: blur(55px);

  animation:
    brilloSuave 5s ease-in-out infinite;
}

@keyframes brilloSuave {
  0%,100% {
    opacity: .4;
    transform: scale(.96);
  }

  50% {
    opacity: .9;
    transform: scale(1.05);
  }
}

@keyframes aparecerImagen {
  from {
    opacity: 0;

    transform:
      translateY(24px)
      scale(.96);
  }

  to {
    opacity: 1;

    transform:
      translateY(0)
      scale(1);
  }
}

/* ==========================================
   MENSAJE BREVE
========================================== */

.mensaje {
  max-width: 500px;
  margin: 26px auto 0;

  color: #bcd3e1;

  font-family: Georgia,serif;
  font-size: clamp(15px,2.5vw,18px);
  line-height: 1.85;

  animation:
    aparecerImagen 1s .3s both;
}

.mensaje span {
  color: var(--celeste);
}

.corazon {
  margin-top: 20px;

  color: #a6e6f3;
  font-size: 28px;

  animation:
    latir 2.3s ease-in-out infinite;
}

@keyframes latir {
  0%,100% {
    transform: scale(1);
  }

  50% {
    transform: scale(1.18);
  }
}

.firma {
  margin-top: 16px;

  color: #7698b1;

  font-size: 10px;
  letter-spacing: 3px;
}

/* ==========================================
   CELULAR
========================================== */

@media(max-width:600px) {

  .pagina {
    padding: 32px 16px 50px;
  }

  .imagen-contenedor {
    width: min(400px,100%);
  }

  .subtitulo {
    font-size: 13px;
  }

  .mensaje {
    font-size: 15px;
  }

}

@media(prefers-reduced-motion:reduce) {

  *,*::before,*::after {
    animation: none !important;
  }

}

</style>
</head>

<body>

<!-- FONDO -->

<div class="fondo">

  <div class="luz uno"></div>
  <div class="luz dos"></div>

</div>


<!-- CONTENIDO -->

<main class="pagina">

  <section class="contenido">

    <div class="etiqueta">
      ✦ A LITTLE HUG FOR YOU ✦
    </div>

    <h1>
      Un abrazo <span>para ti.</span>
    </h1>


    <!-- IMAGEN QUE TÚ TIENES -->

    <div class="imagen-contenedor">

      <div class="resplandor"></div>

      <img
        src="abrazooso.png"
        alt="Una imagen especial de abrazo para ti">

    </div>


    <!-- FRASE PRINCIPAL -->

    <p class="mensaje">

      No olvides pasar por aquí,
      si algún día necesitas un
      <span>abrazo</span>,
      este pequeño espacio
      te estará esperando.

    </p>


    <div class="corazon">
      ♡
    </div>

    <div class="firma">
      JUST FOR YOU
    </div>

  </section>

</main>


<script>

/* ==========================================
   AJUSTAR ALTURA EN EL BUSCADOR
========================================== */

function avisarAltura() {

  requestAnimationFrame(() => {

    window.parent.postMessage({

      tipo: "alturaPagina",

      altura:
        document.documentElement.scrollHeight

    }, window.location.origin);

  });

}

window.addEventListener("load", avisarAltura);

window.addEventListener("resize", avisarAltura);

/* Volver a medir cuando cargue la imagen */

const imagen = document.querySelector(
  ".imagen-contenedor img"
);

imagen.addEventListener("load", avisarAltura);

</script>

</body>
</html>
