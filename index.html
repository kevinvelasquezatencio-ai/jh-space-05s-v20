<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Un espacio para ti, Jhos</title>

<meta
name="robots"
content="noindex, nofollow, noarchive"
>

<meta
name="theme-color"
content="#050505"
>

<style>

/* =========================================================
   GENERAL
========================================================= */

:root{
    --negro:#050505;
    --negro2:#0b0a07;

    --dorado:#e2bb59;
    --dorado-claro:#ffe49a;
    --dorado-suave:#b79343;

    --blanco:#f7f2e7;
    --gris:#99958c;

    --verde:#00df84;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    overflow:hidden;

    color:var(--blanco);

    font-family:
        "Segoe UI",
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at 18% 15%,
            rgba(229,184,70,.10),
            transparent 28%
        ),

        radial-gradient(
            circle at 82% 78%,
            rgba(255,202,56,.06),
            transparent 30%
        ),

        linear-gradient(
            145deg,
            #020202,
            #090805 48%,
            #020202
        );
}


/* =========================================================
   FONDO
========================================================= */

.fondo{
    position:fixed;
    inset:0;

    pointer-events:none;

    overflow:hidden;
}

.fondo::before{
    content:"";

    position:absolute;
    inset:0;

    background:
        radial-gradient(
            circle at 50% 40%,
            rgba(228,184,68,.055),
            transparent 32%
        );

    animation:
        respirarFondo
        6s ease-in-out infinite;
}

@keyframes respirarFondo{

    0%,100%{
        opacity:.4;
    }

    50%{
        opacity:1;
    }

}


/* =========================================================
   LÍNEAS DECORATIVAS
========================================================= */

.linea{
    position:absolute;

    width:760px;
    height:145px;

    border-radius:50%;

    border-top:
        1px solid
        rgba(227,187,82,.18);

    pointer-events:none;
}

.linea.uno{
    top:12%;
    left:-230px;

    transform:rotate(-25deg);
}

.linea.dos{
    right:-260px;
    bottom:9%;

    transform:rotate(-29deg);
}

.linea.tres{
    top:48%;
    right:-480px;

    opacity:.45;

    transform:rotate(-20deg);
}


/* =========================================================
   PARTÍCULAS
========================================================= */

#particulas{
    position:fixed;
    inset:0;

    pointer-events:none;

    overflow:hidden;
}

.particula{
    position:absolute;

    width:3px;
    height:3px;

    border-radius:50%;

    background:#f4ce6b;

    box-shadow:
        0 0 8px
        rgba(255,213,103,.75);

    opacity:0;

    animation:
        flotar
        linear infinite;
}

@keyframes flotar{

    0%{
        transform:
            translateY(105vh)
            scale(.5);

        opacity:0;
    }

    15%{
        opacity:.55;
    }

    80%{
        opacity:.25;
    }

    100%{
        transform:
            translateY(-15vh)
            scale(1.1);

        opacity:0;
    }

}


/* =========================================================
   PANTALLA DE ACCESO
========================================================= */

#pantallaAcceso{
    position:fixed;

    inset:0;

    z-index:100;

    display:flex;

    justify-content:center;
    align-items:center;

    padding:20px;

    transition:
        opacity 1s ease,
        visibility 1s ease;
}

#pantallaAcceso.ocultar{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}


/* =========================================================
   NOMBRE SUPERIOR
========================================================= */

.nombre-fondo{
    position:absolute;

    top:7%;

    left:0;
    right:0;

    text-align:center;

    pointer-events:none;
}

.nombre-fondo small{
    display:block;

    margin-bottom:10px;

    color:#a28b51;

    font-size:9px;

    letter-spacing:6px;
}

.nombre-fondo h1{
    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        clamp(
            39px,
            7vw,
            66px
        );

    font-weight:400;

    color:#f5f1e8;
}

.nombre-fondo h1 span{
    color:#edc75e;

    text-shadow:
        0 0 32px
        rgba(237,199,94,.16);
}


/* =========================================================
   TARJETA GLASS
========================================================= */

.login-card{
    position:relative;

    z-index:5;

    width:
        min(
            480px,
            94vw
        );

    margin-top:75px;

    padding:
        36px 30px
        32px;

    border:
        1px solid
        rgba(255,255,255,.18);

    border-radius:30px;

    text-align:center;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(235,193,79,.08),
            transparent 45%
        ),

        linear-gradient(
            145deg,
            rgba(255,255,255,.085),
            rgba(255,255,255,.025)
        );

    backdrop-filter:
        blur(19px);

    -webkit-backdrop-filter:
        blur(19px);

    box-shadow:
        0 35px 95px
        rgba(0,0,0,.68),

        inset 0 1px 0
        rgba(255,255,255,.12);

    overflow:hidden;

    animation:
        entradaTarjeta
        1s ease;

    transition:
        border-color .5s ease,
        box-shadow .5s ease,
        background .5s ease;
}

.login-card::before{
    content:"";

    position:absolute;

    top:-120px;
    left:50%;

    width:290px;
    height:220px;

    transform:
        translateX(-50%);

    border-radius:50%;

    background:
        rgba(231,187,68,.10);

    filter:
        blur(70px);

    pointer-events:none;
}

@keyframes entradaTarjeta{

    from{
        opacity:0;

        transform:
            translateY(25px)
            scale(.96);
    }

    to{
        opacity:1;

        transform:
            translateY(0)
            scale(1);
    }

}


/* =========================================================
   ICONO
========================================================= */

.icono-llave{
    position:relative;

    z-index:2;

    width:54px;
    height:54px;

    margin:
        0 auto
        17px;

    display:flex;

    justify-content:center;
    align-items:center;

    border-radius:17px;

    border:
        1px solid
        rgba(230,190,78,.33);

    background:
        rgba(223,180,54,.055);

    color:#edc65e;

    font-size:22px;

    box-shadow:
        0 0 28px
        rgba(226,184,48,.10);

    transition:.4s ease;
}


/* =========================================================
   TEXTOS
========================================================= */

.login-card h2{
    position:relative;

    z-index:2;

    color:#f4f1e9;

    font-size:
        clamp(
            25px,
            5vw,
            32px
        );

    font-weight:650;
}

.login-card h2 span{
    color:#e7c24f;
}

.subtitulo{
    position:relative;

    z-index:2;

    margin-top:8px;

    color:#8f8a7f;

    font-size:11px;

    line-height:1.7;
}

.pista{
    position:relative;

    z-index:2;

    margin-top:8px;

    color:#aa9154;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:11px;

    font-style:italic;
}


/* =========================================================
   OTP 4 CUADROS
========================================================= */

.otp{
    position:relative;

    z-index:2;

    display:flex;

    justify-content:center;

    gap:12px;

    margin-top:30px;

    min-height:74px;
}

.otp input{
    width:61px;
    height:68px;

    border:
        1px solid
        rgba(225,187,78,.38);

    border-radius:16px;

    outline:none;

    background:
        rgba(5,5,5,.68);

    color:#fff;

    text-align:center;

    font-size:24px;

    font-weight:650;

    caret-color:#edc65e;

    box-shadow:
        inset 0 0 20px
        rgba(0,0,0,.40);

    transition:
        border-color .25s ease,
        box-shadow .25s ease,
        transform .25s ease;
}

.otp input:focus{
    border-color:#efc95d;

    transform:
        translateY(-3px);

    box-shadow:
        0 0 22px
        rgba(239,201,93,.13),

        inset 0 0 20px
        rgba(0,0,0,.45);
}


/* =========================================================
   BOTÓN VERIFICAR
========================================================= */

.verificar{
    position:relative;

    z-index:2;

    width:
        min(
            310px,
            100%
        );

    height:50px;

    margin-top:28px;

    border:0;

    border-radius:13px;

    cursor:pointer;

    color:#171207;

    font-size:11px;

    font-weight:750;

    letter-spacing:.9px;

    background:
        linear-gradient(
            90deg,
            #c9a51d,
            #efd336
        );

    box-shadow:
        0 10px 32px
        rgba(205,170,25,.13);

    transition:.3s ease;
}

.verificar:hover{
    transform:
        translateY(-2px);

    filter:
        brightness(1.07);
}

.verificar:disabled{
    cursor:default;
    transform:none;
}


/* =========================================================
   MENSAJE ESTADO
========================================================= */

.estado{
    position:relative;

    z-index:2;

    min-height:25px;

    margin-top:17px;

    color:#757168;

    font-size:10px;

    line-height:1.6;
}


/* =========================================================
   ANIMACIÓN DE VERIFICACIÓN
========================================================= */

.verificando .otp{
    height:115px;
}


/* CUADRO 1 */

.verificando
.otp input:nth-child(1){

    animation:
        girarUno
        1.25s
        ease-in-out
        infinite;
}


/* CUADRO 2 */

.verificando
.otp input:nth-child(2){

    animation:
        girarDos
        1.25s
        ease-in-out
        infinite;
}


/* CUADRO 3 */

.verificando
.otp input:nth-child(3){

    animation:
        girarTres
        1.25s
        ease-in-out
        infinite;
}


/* CUADRO 4 */

.verificando
.otp input:nth-child(4){

    animation:
        girarCuatro
        1.25s
        ease-in-out
        infinite;
}


/* MOVIMIENTO PARECIDO A LA REFERENCIA */

@keyframes girarUno{

    0%{
        transform:
            translate(0,0)
            rotate(0deg);
    }

    25%{
        transform:
            translate(32px,-13px)
            rotate(90deg);
    }

    50%{
        transform:
            translate(51px,27px)
            rotate(180deg);
    }

    75%{
        transform:
            translate(20px,49px)
            rotate(270deg);
    }

    100%{
        transform:
            translate(0,0)
            rotate(360deg);
    }

}


@keyframes girarDos{

    0%{
        transform:
            translate(0,0)
            rotate(0deg);
    }

    25%{
        transform:
            translate(18px,39px)
            rotate(90deg);
    }

    50%{
        transform:
            translate(-18px,54px)
            rotate(180deg);
    }

    75%{
        transform:
            translate(-47px,22px)
            rotate(270deg);
    }

    100%{
        transform:
            translate(0,0)
            rotate(360deg);
    }

}


@keyframes girarTres{

    0%{
        transform:
            translate(0,0)
            rotate(0deg);
    }

    25%{
        transform:
            translate(-31px,14px)
            rotate(90deg);
    }

    50%{
        transform:
            translate(-50px,-27px)
            rotate(180deg);
    }

    75%{
        transform:
            translate(-17px,-48px)
            rotate(270deg);
    }

    100%{
        transform:
            translate(0,0)
            rotate(360deg);
    }

}


@keyframes girarCuatro{

    0%{
        transform:
            translate(0,0)
            rotate(0deg);
    }

    25%{
        transform:
            translate(-17px,-38px)
            rotate(90deg);
    }

    50%{
        transform:
            translate(18px,-53px)
            rotate(180deg);
    }

    75%{
        transform:
            translate(47px,-20px)
            rotate(270deg);
    }

    100%{
        transform:
            translate(0,0)
            rotate(360deg);
    }

}


/* =========================================================
   SPINNER
========================================================= */

.spinner{
    width:16px;
    height:16px;

    display:inline-block;

    margin-right:8px;

    vertical-align:middle;

    border-radius:50%;

    border:
        2px solid
        rgba(20,20,20,.25);

    border-top-color:#171307;

    animation:
        spinner
        .7s linear infinite;
}

@keyframes spinner{

    to{
        transform:
            rotate(360deg);
    }

}


/* =========================================================
   ERROR
========================================================= */

.login-card.error{
    border-color:
        rgba(255,75,75,.48);

    animation:
        errorShake
        .45s ease;
}

.login-card.error
.otp input{
    border-color:#d64e4e;

    color:#ff8181;
}

.login-card.error
.icono-llave{
    color:#ff6565;

    border-color:
        rgba(255,70,70,.38);
}

@keyframes errorShake{

    0%,100%{
        transform:translateX(0);
    }

    25%{
        transform:translateX(-8px);
    }

    50%{
        transform:translateX(8px);
    }

    75%{
        transform:translateX(-4px);
    }

}


/* =========================================================
   ÉXITO VERDE
========================================================= */

.login-card.correcto{
    border-color:
        rgba(0,230,135,.42);

    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(0,215,125,.14),
            transparent 48%
        ),

        linear-gradient(
            145deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.022)
        );

    box-shadow:
        0 35px 95px
        rgba(0,0,0,.68),

        0 0 60px
        rgba(0,220,125,.09);
}


/* =========================================================
   PANTALLA SUCCESS
========================================================= */

#exito{
    display:none;

    position:relative;

    z-index:3;

    padding:
        5px 0
        8px;
}

#exito.visible{
    display:block;

    animation:
        aparecerExito
        .6s ease;
}

@keyframes aparecerExito{

    from{
        opacity:0;

        transform:
            translateY(12px)
            scale(.93);
    }

    to{
        opacity:1;

        transform:
            translateY(0)
            scale(1);
    }

}


.icono-seguro{
    width:48px;
    height:48px;

    margin:
        0 auto
        15px;

    display:flex;

    justify-content:center;
    align-items:center;

    border-radius:15px;

    border:
        1px solid
        rgba(0,220,125,.50);

    background:
        rgba(0,210,120,.06);

    color:#00e186;

    font-size:22px;

    box-shadow:
        0 0 27px
        rgba(0,220,125,.15);
}


#exito h3{
    font-size:
        clamp(
            23px,
            5vw,
            29px
        );

    color:#f1f1f1;

    font-weight:650;
}

#exito h3 span{
    color:#00df84;
}

#exito .sub-exito{
    margin-top:7px;

    color:#737a74;

    font-size:10px;
}


/* =========================================================
   CÍRCULO VERDE
========================================================= */

.circulo-check{
    position:relative;

    width:145px;
    height:145px;

    margin:
        27px auto
        24px;

    display:flex;

    justify-content:center;
    align-items:center;

    border-radius:50%;

    border:
        2px solid
        rgba(0,220,125,.48);

    box-shadow:
        0 0 35px
        rgba(0,220,125,.08),

        inset 0 0 35px
        rgba(0,220,125,.035);

    animation:
        expandirCirculo
        .75s ease;
}

.circulo-check::before{
    content:"";

    position:absolute;

    width:105px;
    height:105px;

    border-radius:50%;

    border:
        1px solid
        rgba(0,220,125,.13);
}

@keyframes expandirCirculo{

    0%{
        opacity:0;
        transform:scale(.45);
    }

    65%{
        transform:scale(1.08);
    }

    100%{
        opacity:1;
        transform:scale(1);
    }

}


.check-cuadro{
    width:58px;
    height:58px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:16px;

    border:
        3px solid
        #19d77f;

    background:
        #080b09;

    color:white;

    font-size:29px;

    box-shadow:
        0 0 25px
        rgba(0,220,125,.23);

    animation:
        aparecerCheck
        .55s .2s both;
}

@keyframes aparecerCheck{

    from{
        opacity:0;

        transform:
            rotate(-25deg)
            scale(.5);
    }

    to{
        opacity:1;

        transform:
            rotate(0deg)
            scale(1);
    }

}


/* =========================================================
   BOTÓN VERDE
========================================================= */

.verificado{
    width:min(
        300px,
        100%
    );

    height:48px;

    border:0;

    border-radius:13px;

    color:#062b1a;

    font-size:11px;

    font-weight:750;

    letter-spacing:.6px;

    background:
        linear-gradient(
            90deg,
            #00dd81,
            #32e59a
        );

    box-shadow:
        0 10px 32px
        rgba(0,220,125,.15);
}


/* =========================================================
   PÁGINA DESPUÉS DE ENTRAR
========================================================= */

#contenido{
    position:fixed;

    inset:0;

    z-index:50;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:25px;

    opacity:0;

    visibility:hidden;

    pointer-events:none;

    transition:
        opacity 1s ease,
        visibility 1s ease;
}

#contenido.visible{
    opacity:1;

    visibility:visible;

    pointer-events:auto;
}


.bienvenida{
    width:min(
        700px,
        100%
    );

    text-align:center;

    animation:
        aparecerBienvenida
        1.2s ease;
}


@keyframes aparecerBienvenida{

    from{
        opacity:0;

        transform:
            translateY(25px);
    }

    to{
        opacity:1;

        transform:
            translateY(0);
    }

}


.bienvenida .mini{
    color:#a58c50;

    font-size:9px;

    letter-spacing:6px;

    margin-bottom:20px;
}


.bienvenida h1{
    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        clamp(
            50px,
            10vw,
            90px
        );

    line-height:1;

    font-weight:400;

    color:#f5f1e7;
}


.bienvenida h1 span{
    color:#e8bf55;

    text-shadow:
        0 0 35px
        rgba(232,191,85,.15);
}


.bienvenida p{
    max-width:560px;

    margin:
        30px auto
        0;

    color:#a29c91;

    font-size:
        clamp(
            14px,
            2vw,
            17px
        );

    line-height:1.9;
}


.bienvenida p strong{
    color:#ddd0ac;

    font-weight:400;
}


.separador{
    width:90px;
    height:1px;

    margin:
        35px auto
        0;

    background:
        linear-gradient(
            90deg,
            transparent,
            #d4ae50,
            transparent
        );
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:520px){

    .nombre-fondo{
        top:6%;
    }

    .login-card{
        margin-top:75px;

        padding:
            32px 17px
            28px;
    }

    .otp{
        gap:8px;
    }

    .otp input{
        width:54px;
        height:62px;

        border-radius:14px;

        font-size:22px;
    }

    .verificando .otp{
        transform:scale(.90);
    }

    .circulo-check{
        width:135px;
        height:135px;
    }

}

</style>
</head>


<body>


<!-- =========================================================
     FONDO
========================================================= -->

<div class="fondo">

    <div class="linea uno"></div>
    <div class="linea dos"></div>
    <div class="linea tres"></div>

</div>


<div id="particulas"></div>



<!-- =========================================================
     ACCESO
========================================================= -->

<section id="pantallaAcceso">


    <div class="nombre-fondo">

        <small>
            A LITTLE SPACE ✦
        </small>

        <h1>
            Hola, <span>Jhoselin</span>
        </h1>

    </div>



    <div
    class="login-card"
    id="loginCard"
    >


        <!-- FORMULARIO -->

        <div id="formulario">


            <div class="icono-llave">
                🔑
            </div>


            <h2>
                Verify <span>Code</span>
            </h2>


            <p class="subtitulo">

                Ingresa el código
                para continuar.

            </p>


            <div class="pista">

                Hay fechas que no se olvidan.

            </div>



            <div class="otp">


                <input
                id="d1"
                type="tel"
                inputmode="numeric"
                maxlength="1"
                autocomplete="off"
                >


                <input
                id="d2"
                type="tel"
                inputmode="numeric"
                maxlength="1"
                autocomplete="off"
                >


                <input
                id="d3"
                type="tel"
                inputmode="numeric"
                maxlength="1"
                autocomplete="off"
                >


                <input
                id="d4"
                type="tel"
                inputmode="numeric"
                maxlength="1"
                autocomplete="off"
                >


            </div>



            <button
            class="verificar"
            id="btnVerificar"
            onclick="verificarCodigo()"
            >

                VERIFY CODE

            </button>



            <div
            class="estado"
            id="estado"
            >

                Ingresa los 4 números.

            </div>


        </div>



        <!-- SUCCESS -->

        <div id="exito">


            <div class="icono-seguro">
                ♡
            </div>


            <h3>

                Verified
                <span>Successfully</span>

            </h3>


            <div class="sub-exito">

                El código ha sido confirmado.

            </div>



            <div class="circulo-check">

                <div class="check-cuadro">
                    ✓
                </div>

            </div>



            <button
            class="verificado"
            >

                ✓ VERIFIED & SECURED

            </button>


        </div>


    </div>


</section>



<!-- =========================================================
     CONTENIDO TEMPORAL
========================================================= -->

<section id="contenido">


    <div class="bienvenida">


        <div class="mini">

            A LITTLE SPACE ✦

        </div>


        <h1>

            Hola,
            <span>Jhoselin</span>

        </h1>


        <p>

            <strong>
                Qué bien que sigas pasando por aquí.
            </strong>

            <br><br>

            Espero que estés muy bien.

        </p>


        <div class="separador"></div>


    </div>


</section>



<script>

/* =========================================================
   CONTRASEÑA
========================================================= */

const CLAVE = "5362";


const inputs = [

    document.getElementById("d1"),
    document.getElementById("d2"),
    document.getElementById("d3"),
    document.getElementById("d4")

];


const loginCard =
document.getElementById(
    "loginCard"
);


const btnVerificar =
document.getElementById(
    "btnVerificar"
);


const estado =
document.getElementById(
    "estado"
);


const formulario =
document.getElementById(
    "formulario"
);


const exito =
document.getElementById(
    "exito"
);



/* =========================================================
   INPUTS
========================================================= */

inputs.forEach(
(input,index)=>{


    input.addEventListener(
    "input",
    function(){


        this.value =
        this.value.replace(
            /\D/g,
            ""
        );


        if(
            this.value &&
            index <
            inputs.length-1
        ){

            inputs[
                index+1
            ].focus();

        }


        if(
            inputs.every(
                input =>
                input.value !== ""
            )
        ){

            btnVerificar.focus();

        }

    });



    input.addEventListener(
    "keydown",
    function(event){


        if(
            event.key ===
            "Backspace"
            &&
            this.value === ""
            &&
            index > 0
        ){

            inputs[
                index-1
            ].focus();

        }

    });


});



/* =========================================================
   ENTER
========================================================= */

document.addEventListener(
"keydown",
function(event){


    if(
        event.key === "Enter"
        &&
        formulario.style.display
        !== "none"
    ){

        verificarCodigo();

    }


});



/* =========================================================
   VERIFICAR
========================================================= */

function verificarCodigo(){


    const codigo =
    inputs
    .map(
        input =>
        input.value
    )
    .join("");


    if(
        codigo.length < 4
    ){

        estado.textContent =
        "Completa los 4 números.";

        return;

    }


    /* BLOQUEAR */

    inputs.forEach(
        input =>
        input.disabled=true
    );


    btnVerificar.disabled =
    true;


    loginCard
    .classList
    .remove(
        "error"
    );


    loginCard
    .classList
    .add(
        "verificando"
    );


    btnVerificar.innerHTML = `

        <span class="spinner"></span>
        VERIFYING CODE...

    `;


    estado.textContent =
    "Verificando código...";


    /* LOS CUADROS GIRAN */

    setTimeout(()=>{


        loginCard
        .classList
        .remove(
            "verificando"
        );


        if(
            codigo === CLAVE
        ){

            mostrarCorrecto();

        }

        else{

            mostrarError();

        }


    },2600);


}



/* =========================================================
   CORRECTO
========================================================= */

function mostrarCorrecto(){


    loginCard
    .classList
    .add(
        "correcto"
    );


    formulario.style.display =
    "none";


    exito
    .classList
    .add(
        "visible"
    );


    /* ESPERA PARA VER EL CHECK */

    setTimeout(()=>{


        document
        .getElementById(
            "pantallaAcceso"
        )
        .classList
        .add(
            "ocultar"
        );


        document
        .getElementById(
            "contenido"
        )
        .classList
        .add(
            "visible"
        );


    },2800);


}



/* =========================================================
   ERROR
========================================================= */

function mostrarError(){


    loginCard
    .classList
    .add(
        "error"
    );


    estado.innerHTML = `

        Código incorrecto.
        <br>
        Inténtalo nuevamente.

    `;


    btnVerificar.textContent =
    "TRY AGAIN";


    inputs.forEach(
        input =>
        input.disabled=false
    );


    btnVerificar.disabled =
    false;


    setTimeout(()=>{


        inputs.forEach(
            input =>
            input.value=""
        );


        inputs[0].focus();


    },350);


    setTimeout(()=>{


        loginCard
        .classList
        .remove(
            "error"
        );


    },900);


}



/* =========================================================
   PARTÍCULAS
========================================================= */

function crearParticulas(){


    const contenedor =
    document.getElementById(
        "particulas"
    );


    for(
        let i=0;
        i<32;
        i++
    ){


        const punto =
        document.createElement(
            "span"
        );


        punto.className =
        "particula";


        punto.style.left =
        Math.random()*100
        +"%";


        punto.style.animationDuration =
        (
            8+
            Math.random()*12
        )
        +"s";


        punto.style.animationDelay =
        Math.random()*10
        +"s";


        const tamano =
        1.5+
        Math.random()*2.7;


        punto.style.width =
        tamano+"px";


        punto.style.height =
        tamano+"px";


        contenedor.appendChild(
            punto
        );


    }


}


crearParticulas();



/* =========================================================
   FOCUS
========================================================= */

window.addEventListener(
"load",
()=>{


    setTimeout(()=>{

        inputs[0].focus();

    },700);


});

</script>


</body>
</html>
